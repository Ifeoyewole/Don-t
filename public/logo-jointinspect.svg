<svg width="720" height="160" viewBox="0 0 720 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="160" rx="28" fill="white" fill-opacity="0"/>

  <!-- Logo Icon: Tilted rounded square with pipe joint + crosshair -->
  <g transform="translate(24 16)">
    <g transform="rotate(10 64 64)">
      <!-- Outer rounded square -->
      <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#logoGrad)"/>

      <!-- Left pipe section -->
      <rect x="14" y="46" width="44" height="36" rx="6" fill="rgba(255,255,255,0.18)"/>
      <rect x="14" y="50" width="44" height="28" rx="4" stroke="white" stroke-width="3" fill="none"/>

      <!-- Right pipe section -->
      <rect x="70" y="46" width="44" height="36" rx="6" fill="rgba(255,255,255,0.18)"/>
      <rect x="70" y="50" width="44" height="28" rx="4" stroke="white" stroke-width="3" fill="none"/>

      <!-- Joint gap (the inspection zone) -->
      <rect x="55" y="44" width="18" height="40" rx="3" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-dasharray="4 3"/>

      <!-- Crosshair overlay -->
      <line x1="64" y1="30" x2="64" y2="98" stroke="white" stroke-width="2" stroke-opacity="0.6"/>
      <line x1="30" y1="64" x2="98" y2="64" stroke="white" stroke-width="2" stroke-opacity="0.6"/>

      <!-- Crosshair center ring -->
      <circle cx="64" cy="64" r="12" stroke="white" stroke-width="2.5" fill="none" stroke-opacity="0.85"/>

      <!-- Crosshair center dot -->
      <circle cx="64" cy="64" r="3.5" fill="white"/>

      <!-- Measurement tick marks -->
      <line x1="54" y1="40" x2="54" y2="34" stroke="white" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
      <line x1="74" y1="40" x2="74" y2="34" stroke="white" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
      <line x1="54" y1="34" x2="74" y2="34" stroke="white" stroke-width="1.5" stroke-opacity="0.5"/>

      <!-- Small arrow heads on the measurement line -->
      <path d="M56 34L54 32V36Z" fill="white" fill-opacity="0.7"/>
      <path d="M72 34L74 32V36Z" fill="white" fill-opacity="0.7"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g>
    <text x="172" y="72" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.04em" fill="#041632">Joint</text>
    <text x="295" y="72" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.04em" fill="#0051D5">Inspect</text>

    <!-- Tagline -->
    <text x="174" y="106" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#4B5A6E" letter-spacing="0.14em">PIPE JOINT INSPECTION</text>
  </g>

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="logoGrad" x1="64" y1="4" x2="64" y2="124" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A6FE8"/>
      <stop offset="0.5" stop-color="#0051D5"/>
      <stop offset="1" stop-color="#041632"/>
    </linearGradient>
  </defs>
</svg>
