<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Tilted rounded square background -->
  <g transform="rotate(10 32 32)">
    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#favGrad)"/>

    <!-- Left pipe -->
    <rect x="10" y="24" width="19" height="16" rx="3" stroke="white" stroke-width="2" fill="none"/>

    <!-- Right pipe -->
    <rect x="35" y="24" width="19" height="16" rx="3" stroke="white" stroke-width="2" fill="none"/>

    <!-- Joint gap zone -->
    <rect x="27" y="22" width="10" height="20" rx="2" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.5)" stroke-width="1" stroke-dasharray="3 2"/>

    <!-- Crosshair lines -->
    <line x1="32" y1="14" x2="32" y2="50" stroke="white" stroke-width="1.5" stroke-opacity="0.55"/>
    <line x1="14" y1="32" x2="50" y2="32" stroke="white" stroke-width="1.5" stroke-opacity="0.55"/>

    <!-- Crosshair ring -->
    <circle cx="32" cy="32" r="7" stroke="white" stroke-width="2" fill="none" stroke-opacity="0.8"/>

    <!-- Center dot -->
    <circle cx="32" cy="32" r="2" fill="white"/>
  </g>

  <defs>
    <linearGradient id="favGrad" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A6FE8"/>
      <stop offset="0.5" stop-color="#0051D5"/>
      <stop offset="1" stop-color="#041632"/>
    </linearGradient>
  </defs>
</svg>
