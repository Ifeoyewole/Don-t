steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        gcloud storage cp gs://joint-inspection-510310-data/datasets/sewer-ml/scripts/extract_curated_images.py /workspace/extract_curated_images.py

  - name: 'python:3.10-slim'
    entrypoint: 'bash'
    secretEnv: ['SEWER_PASSWORD']
    args:
      - '-c'
      - |
        set -euo pipefail
        apt-get update && apt-get install -y curl
        pip install --no-cache-dir google-cloud-storage
        python3 /workspace/extract_curated_images.py

availableSecrets:
  secretManager:
    - versionName: projects/joint-inspection-510310/secrets/sewer-ml-download-password/versions/latest
      env: 'SEWER_PASSWORD'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100

timeout: '3600s'
