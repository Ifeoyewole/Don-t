steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        gcloud storage cp gs://joint-inspection-510310-data/datasets/sewer-ml/scripts/analyze_annotations.py /workspace/analyze_annotations.py

  - name: 'python:3.10-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        pip install --no-cache-dir google-cloud-storage
        python3 /workspace/analyze_annotations.py

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
