# Low-data metadata-only dry run; still incurs ordinary Cloud Build costs.
steps:
  - name: 'python:3.11-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        python -m pip install --no-cache-dir google-cloud-storage requests 'pillow>=10,<14'
        python scripts/sewer_ml_pipeline/curate_staged.py --project=joint-inspection-510310 --stage=20000
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  diskSizeGb: 50
timeout: 3600s
