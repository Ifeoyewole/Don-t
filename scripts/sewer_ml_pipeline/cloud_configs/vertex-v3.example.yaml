# TEMPLATE ONLY — GPU availability, quota, approval and container image must be verified.
# Vertex AI custom-job config; do not submit without a verifiable budget approval.
workerPoolSpecs:
- machineSpec:
    machineType: n1-standard-8
    acceleratorType: NVIDIA_TESLA_T4
    acceleratorCount: 1
  replicaCount: 1
  diskSpec:
    bootDiskType: pd-ssd
    bootDiskSizeGb: 150
  containerSpec:
    imageUri: europe-west2-docker.pkg.dev/joint-inspection-510310/jointinspect-training/v3:REPLACE_WITH_VERIFIED_DIGEST
    args:
    - --train=/workspace/manifests/train.csv
    - --early-stop=/workspace/manifests/early_stop.csv
    - --threshold-tune=/workspace/manifests/threshold_tune.csv
    - --dev-report=/workspace/manifests/dev_report.csv
    - --images-dir=/workspace/images
    - --output=/workspace/output
    - --config-id=REPLACE_WITH_DATASET_HASH_AND_CONFIG_ID
    - --architecture=efficientnet_b0
    - --epochs=20
    - --batch-size=32

