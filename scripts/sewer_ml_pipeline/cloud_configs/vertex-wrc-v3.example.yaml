# TEMPLATE ONLY — GPU availability, quota, rights verification, and container image must be verified.
# Vertex AI custom-job config for WRc InceptionResNetV2 adaptation; do not submit without verifiable budget approval and rights evidence.
workerPoolSpecs:
- machineSpec:
    machineType: n1-standard-8
    acceleratorType: NVIDIA_TESLA_T4
    acceleratorCount: 1
  replicaCount: 1
  # Storage safety: 150 GiB boot disk (reconciled within vertex limits)
  diskSpec:
    bootDiskType: pd-ssd
    bootDiskSizeGb: 150
  containerSpec:
    imageUri: europe-west2-docker.pkg.dev/joint-inspection-510310/joint-inspection-training/wrc-v3:REPLACE_WITH_VERIFIED_DIGEST
    args:
    - --project=joint-inspection-510310
    - --train=gs://joint-inspection-510310-data/datasets/sewer-ml/curated-v3/20k/splits/train.csv
    - --early-stop=gs://joint-inspection-510310-data/datasets/sewer-ml/curated-v3/20k/splits/early_stop.csv
    - --threshold-tune=gs://joint-inspection-510310-data/datasets/sewer-ml/curated-v3/20k/splits/threshold_tune.csv
    - --dev-report=gs://joint-inspection-510310-data/datasets/sewer-ml/curated-v3/20k/splits/dev_report.csv
    - --base-weights=gs://joint-inspection-510310-data/models/external/wrc/inceptionresnetv2/v1/weights.h5
    - --rights-manifest=gs://joint-inspection-510310-data/provenance/wrc_rights.json
    - --output-prefix=gs://joint-inspection-510310-data/models/research/v3-wrc-adapted/REPLACE_WITH_CONFIG_ID
    - --config-id=REPLACE_WITH_DATASET_HASH_AND_CONFIG_ID
    - --architecture=inceptionresnetv2
    - --epochs=20
    - --batch-size=32
