steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west2-docker.pkg.dev/joint-inspection-510310/joint-inspection-training/v3:latest'
      - '-f'
      - 'scripts/sewer_ml_pipeline/cloud_configs/v3-worker.Dockerfile'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west2-docker.pkg.dev/joint-inspection-510310/joint-inspection-training/v3:latest'
images:
  - 'europe-west2-docker.pkg.dev/joint-inspection-510310/joint-inspection-training/v3:latest'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s
