steps:
- name: python:3.12-slim
  id: build-family-grouped-manifests
  entrypoint: bash
  args:
  - -c
  - |
    set -eu
    python -m pip install --no-cache-dir --target=/workspace/manifest-deps google-cloud-storage==3.4.1
    PYTHONPATH=/workspace/manifest-deps:/workspace python scripts/external_datasets/build_inspect_view_manifests.py \
      --project="$PROJECT_ID" \
      --scope=training/configs/inspect_view_scope_v1.json \
      --output=/workspace/inspect-view-manifests
- name: gcr.io/cloud-builders/gcloud
  id: publish-versioned-manifests
  waitFor: [build-family-grouped-manifests]
  entrypoint: bash
  args:
  - -c
  - |
    set -eu
    gcloud storage cp --recursive --no-clobber /workspace/inspect-view-manifests/ \
      gs://joint-inspection-510310-data/datasets/manifests/inspect-view-expanded-v1-20261102/
options:
  logging: GCS_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s
