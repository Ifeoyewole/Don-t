# Prepared configuration, never automatically submitted by CI.
steps:
- name: gcr.io/cloud-builders/docker
  args: [build, -f, scripts/cloud/unified-preview.Dockerfile, -t, 'europe-west2-docker.pkg.dev/$PROJECT_ID/joint-inspection-training/unified-engineering-preview:$BUILD_ID', .]
images: ['europe-west2-docker.pkg.dev/$PROJECT_ID/joint-inspection-training/unified-engineering-preview:$BUILD_ID']
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 900s
