name: Apply PR5 CV runtime contracts

on:
  push:
    branches:
      - fix/cv-runtime-contracts

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/cv-runtime-contracts
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply CV runtime hardening
        run: python tools/apply_pr5_cv_runtime_contracts.py

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend/app backend/tests

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Remove one-shot repair scaffolding
        run: rm -f tools/apply_pr5_cv_runtime_contracts.py .github/workflows/apply-pr5-cv-runtime-contracts.yml

      - name: Commit CV runtime hardening
        run: |
          git config user.name "jointinspect-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git commit -m "fix: harden CV runtime contracts"
          git push origin HEAD:fix/cv-runtime-contracts
