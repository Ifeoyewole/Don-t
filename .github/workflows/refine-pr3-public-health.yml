name: Refine PR3 public model health

on:
  push:
    branches:
      - fix/gateway-runtime-hardening

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/gateway-runtime-hardening
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply public health refinement
        run: python tools/refine_pr3_public_health.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check gateway syntax
        run: node --check 'api/v1/cv/[...route].js'

      - name: Typecheck gateway source
        run: npx tsc -p api/tsconfig.json --noEmit

      - name: Production build
        run: npm run build

      - name: Remove one-shot refinement scaffolding
        run: rm -f tools/refine_pr3_public_health.py .github/workflows/refine-pr3-public-health.yml

      - name: Commit health refinement
        run: |
          git config user.name "jointinspect-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No refinement changes to commit"
            exit 0
          fi
          git commit -m "fix: expose sanitized primary model readiness"
          git push origin HEAD:fix/gateway-runtime-hardening
