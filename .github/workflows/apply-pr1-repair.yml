name: Apply PR1 engineering repair

on:
  push:
    branches:
      - fix/engineering-authority-gates

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/engineering-authority-gates
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply engineering repair
        run: |
          python tools/apply_pr1_repair.py
          python tools/fix_pr1_geometry_confidence.py

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q backend/app backend/tests

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Remove one-shot repair scaffolding
        run: rm -f tools/apply_pr1_repair.py tools/fix_pr1_geometry_confidence.py .github/workflows/apply-pr1-repair.yml

      - name: Commit repaired code
        run: |
          git config user.name "jointinspect-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git commit -m "fix: harden engineering measurement authority"
          git push origin HEAD:fix/engineering-authority-gates
