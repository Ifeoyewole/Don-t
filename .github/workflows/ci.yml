name: CI - Build, Test, and Lint

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main, codex/authoritative-pipeline-repair]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build, Test, and Lint

    strategy:
      matrix:
        node-version: [20.19.0, 22.12.0]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test --if-present

      - name: Upload coverage
        if: ${{ hashFiles('coverage/coverage-final.json') != '' }}
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

  security-check:
    runs-on: ubuntu-latest
    name: Security Audit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=moderate

  backend-tests:
    runs-on: ubuntu-latest
    name: Backend Tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q

  ml-pipeline-tests:
    runs-on: ubuntu-latest
    name: ML Pipeline Contract Tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU-only ML test dependencies
        run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            pytest requests pillow numpy==1.26.4 pyyaml google-cloud-storage \
            torch==2.5.1 torchvision==0.20.1
      - name: Python syntax validation
        run: python -m compileall -q scripts/sewer_ml_pipeline
      - name: Import and ML contract tests
        run: python -m pytest scripts/sewer_ml_pipeline/tests -q

  pr-validation:
    runs-on: ubuntu-latest
    name: PR Validation
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          validateSingleCommit: false
          validateSingleCommitMatchesPrTitle: false

      - name: Check commit messages
        run: |
          echo "Commit message validation would go here"
          echo "This is a placeholder for commit linting"
