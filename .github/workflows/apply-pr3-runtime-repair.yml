name: Apply PR3 gateway runtime hardening

on:
  push:
    branches:
      - fix/gateway-runtime-hardening

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/gateway-runtime-hardening
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply runtime hardening
        run: python tools/apply_pr3_runtime_repair.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend/gateway dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck gateway
        run: npx tsc -p api/tsconfig.json --noEmit

      - name: Production build
        run: npm run build

      - name: Verify corrected backend health probe
        run: grep -F '/api/v1/cv/health' backend/Dockerfile

      - name: Remove one-shot repair scaffolding
        run: rm -f tools/apply_pr3_runtime_repair.py .github/workflows/apply-pr3-runtime-repair.yml

      - name: Commit runtime hardening
        run: |
          git config user.name "jointinspect-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git commit -m "fix: harden gateway runtime boundaries"
          git push origin HEAD:fix/gateway-runtime-hardening
