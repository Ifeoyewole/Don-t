name: Apply PR4 frontend cleanup

on:
  push:
    branches:
      - refactor/frontend-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: refactor/frontend-cleanup
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply cleanup
        run: python tools/apply_pr4_frontend_cleanup.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Remove one-shot cleanup scaffolding
        run: rm -f tools/apply_pr4_frontend_cleanup.py .github/workflows/apply-pr4-frontend-cleanup.yml

      - name: Commit cleanup
        run: |
          git config user.name "jointinspect-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
            exit 0
          fi
          git commit -m "refactor: clean inspection frontend runtime paths"
          git push origin HEAD:refactor/frontend-cleanup
