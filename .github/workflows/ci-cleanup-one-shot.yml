name: CI cleanup one-shot

on:
  push:
    branches:
      - fix/ci-green-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: fix/ci-green-cleanup
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Upgrade patched Vitest line
        run: npm install --save-dev vitest@4.1.12

      - name: Apply non-breaking npm audit fixes
        run: npm audit fix

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Report remaining dev-tool advisories
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Remove one-shot workflow and commit generated cleanup
        run: |
          rm -f .github/workflows/ci-cleanup-one-shot.yml
          git config user.name "jointinspect-ci-cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/ci-cleanup-one-shot.yml
          if git diff --cached --quiet; then
            echo "No dependency cleanup changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh safe dev dependency fixes"
          git push origin HEAD:fix/ci-green-cleanup
