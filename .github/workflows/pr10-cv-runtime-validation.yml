name: PR10 CV runtime validation

on:
  push:
    branches:
      - fix/cv-runtime-contracts

jobs:
  backend-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Run CV runtime contract tests
        run: pytest -q backend/tests/test_cv_runtime_contracts.py
      - name: Run full backend test suite
        run: pytest -q backend/tests
